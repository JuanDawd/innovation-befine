# M-71 — throwaway database for E2E: Postgres 17 behind a local Neon HTTP/WS
# proxy, so the app's Neon serverless driver works unchanged (with
# NEON_LOCAL_PROXY=1). Never point E2E at a shared or production database.
#
#   docker compose -f apps/web/e2e/db/compose.yaml up -d --wait
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/main
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports: ["54329:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 2s
      retries: 30
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports: ["4444:4444"]
    depends_on:
      postgres: { condition: service_healthy }
