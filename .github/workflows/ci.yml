name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Migration consistency (drizzle-kit check)
        run: pnpm --filter @befine/db exec drizzle-kit check

      # M-73: blocks on any critical advisory reachable from production deps.
      # Remaining highs are build-time transitive deps (next-pwa/workbox/webpack,
      # Sentry bundler plugin) — reported but not blocking.
      - name: Dependency audit (critical blocks)
        run: pnpm audit --prod --audit-level critical

      - name: Dependency audit (high, informational)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Unit tests
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Integration tests (cross-module flows)
        run: pnpm --filter @befine/web exec vitest run src/app/__tests__/integration
        env:
          SKIP_ENV_VALIDATION: "1"

  # E2E needs repo secrets: DATABASE_URL, BETTER_AUTH_SECRET (≥32 chars), BETTER_AUTH_URL,
  # NEXT_PUBLIC_APP_URL, RESEND_API_KEY, RESEND_FROM_EMAIL. Build uses SKIP_ENV_VALIDATION;
  # `next start` does not — those vars must be present for the server to boot.
  #
  # Seed credentials can be overridden via:
  #   E2E_ADMIN_PASSWORD, E2E_SECRETARY_PASSWORD, E2E_CLOTHIER_PASSWORD, E2E_STYLIST_PASSWORD
  # Falls back to defaults (Admin123!, Secretary123!, etc.) if secrets are absent.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: ci

    # M-71: E2E runs against a throwaway Postgres behind a local Neon proxy —
    # never against a shared or production database (it creates tickets,
    # payments and payouts). Same stack as apps/web/e2e/db/compose.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d main"
          --health-interval 2s --health-retries 30
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports: ["4444:4444"]

    # Dummy secrets on purpose: nothing here may reach production or send email.
    env:
      NEON_LOCAL_PROXY: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/main
      BETTER_AUTH_SECRET: e2e-only-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_e2e_dummy
      RESEND_FROM_EMAIL: "E2E <e2e@example.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Migrate and seed the E2E database
        run: |
          npx wait-on tcp:4444 --timeout 60000
          pnpm --filter @befine/db exec node --import tsx/esm src/migrate.ts
          pnpm --filter @befine/db exec node --import tsx/esm src/seed.ts
          pnpm --filter @befine/db exec node --import tsx/esm src/seed-e2e.ts

      - name: Install Playwright browsers
        run: pnpm --filter @befine/web exec playwright install --with-deps chromium

      - name: Clean Next.js build cache
        run: rm -rf apps/web/.next

      # SKIP_ENV_VALIDATION: compile-time schema skip. Only the Sentry upload uses real secrets.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Start Next.js server for E2E
        run: pnpm --filter @befine/web exec next start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        # settlement closes the business day, so it runs after chromium (playwright.config.ts)
        run: pnpm --filter @befine/web test:e2e --project=chromium --project=settlement
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
          # Logins use the seed defaults (packages/db/src/seed.ts) — the database is throwaway.

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Production deployment gate — runs only on push to main after both ci and e2e pass.
  # Requires a GitHub Environment named "production" with protection rules:
  #   → Required reviewers: at least 1 (set in repo Settings → Environments → production)
  #   → Wait timer: 0 min (optional delay before deploy)
  # This gives the team a manual approval step before Vercel promotes to production.
  #
  # Setup:
  #   1. In GitHub: Settings → Environments → New environment → name: "production"
  #   2. Enable "Required reviewers" and add team members
  #   3. Add all production secrets to the "production" environment (not just repo secrets)
  #   4. In Vercel: disable automatic production branch deployment (Settings → Git)
  #      so only this workflow triggers the production deploy via `vercel --prod`
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel production
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Post-deployment smoke tests against the live Vercel production URL.
  # Activated by adding VERCEL_PRODUCTION_URL to repo secrets.
  # e2e-deploy:
  #   name: Post-deploy Smoke Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   needs: deploy-production
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v6
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: 24
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm --filter @befine/web exec playwright install --with-deps chromium
  #     - name: Run smoke tests against production
  #       run: pnpm --filter @befine/web test:e2e --project=chromium e2e/smoke.spec.ts
  #       env:
  #         PLAYWRIGHT_BASE_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
