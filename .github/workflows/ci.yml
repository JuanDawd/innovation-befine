name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Migration consistency (drizzle-kit check)
        run: pnpm --filter @befine/db exec drizzle-kit check

      # Informational until the existing backlog of advisories is triaged (see issues-tracker).
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Unit tests
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Integration tests (cross-module flows)
        run: pnpm --filter @befine/web exec vitest run src/app/__tests__/integration
        env:
          SKIP_ENV_VALIDATION: "1"

  # E2E needs repo secrets: DATABASE_URL, BETTER_AUTH_SECRET (≥32 chars), BETTER_AUTH_URL,
  # NEXT_PUBLIC_APP_URL, RESEND_API_KEY, RESEND_FROM_EMAIL. Build uses SKIP_ENV_VALIDATION;
  # `next start` does not — those vars must be present for the server to boot.
  #
  # Seed credentials can be overridden via:
  #   E2E_ADMIN_PASSWORD, E2E_SECRETARY_PASSWORD, E2E_CLOTHIER_PASSWORD, E2E_STYLIST_PASSWORD
  # Falls back to defaults (Admin123!, Secretary123!, etc.) if secrets are absent.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @befine/web exec playwright install --with-deps chromium

      - name: Clean Next.js build cache
        run: rm -rf apps/web/.next

      # SKIP_ENV_VALIDATION: compile-time schema skip — runtime still requires secrets for `next start` + E2E.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Start Next.js server for E2E
        run: pnpm --filter @befine/web exec next start &
        env:
          PORT: 3000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm --filter @befine/web test:e2e --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Seed user credentials — override via GitHub Secrets if seed passwords differ
          E2E_ADMIN_EMAIL: "admin@befine.dev"
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'Admin123!' }}
          E2E_SECRETARY_EMAIL: "secretary@befine.dev"
          E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD || 'Secretary123!' }}
          E2E_STYLIST_EMAIL: "hairdresser@befine.dev"
          E2E_STYLIST_PASSWORD: ${{ secrets.E2E_STYLIST_PASSWORD || 'Stylist123!' }}
          E2E_CLOTHIER_EMAIL: "clothier@befine.dev"
          E2E_CLOTHIER_PASSWORD: ${{ secrets.E2E_CLOTHIER_PASSWORD || 'Clothier123!' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Post-deployment smoke tests against the live Vercel production URL.
