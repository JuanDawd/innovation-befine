name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Migration consistency (drizzle-kit check)
        run: pnpm --filter @befine/db exec drizzle-kit check

      # M-73: blocks on any critical advisory reachable from production deps.
      # Remaining highs are build-time transitive deps (next-pwa/workbox/webpack,
      # Sentry bundler plugin) — reported but not blocking.
      - name: Dependency audit (critical blocks)
        run: pnpm audit --prod --audit-level critical

      - name: Dependency audit (high, informational)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Unit tests
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Integration tests (cross-module flows)
        run: pnpm --filter @befine/web exec vitest run src/app/__tests__/integration
        env:
          SKIP_ENV_VALIDATION: "1"

  # Test databases (M-70b, M-71): scripts/test-db.sh starts a throwaway Postgres
  # behind a local Neon proxy with a random password, written masked to
  # $GITHUB_ENV. No credential of any kind is committed in this file, and these
  # jobs never touch a shared or production database or send real email.
  db-integration:
    name: DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start throwaway database
        run: scripts/test-db.sh up

      - name: Migrate (also proves the chain applies to an empty database)
        run: pnpm --filter @befine/db exec node --import tsx/esm src/migrate.ts

      # packages/db/src/queries against real Postgres; each test truncates and
      # rolls back inside one transaction. Enforces the 80 % coverage threshold.
      - name: Query tests with coverage
        run: pnpm --filter @befine/db test:coverage

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: ci

    env:
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_FROM_EMAIL: "E2E <e2e@example.com>"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Start throwaway database
        run: scripts/test-db.sh up

      # Per-run random values, masked: the auth secret, a Resend key that is
      # never valid (no email can be sent), and the seeded users' passwords,
      # which seed.ts (SEED_*) and the specs (E2E_*) both read.
      - name: Generate ephemeral credentials
        run: |
          # Mask each value before it can appear in any log, then export it.
          put() { echo "::add-mask::$2"; echo "$1=$2" >> "$GITHUB_ENV"; }
          put BETTER_AUTH_SECRET "$(openssl rand -hex 24)"
          put RESEND_API_KEY "re_$(openssl rand -hex 24)"
          for role in ADMIN SECRETARY STYLIST CLOTHIER; do
            pw="$(openssl rand -hex 24)Aa1!"
            put "SEED_${role}_PASSWORD" "$pw"
            put "E2E_${role}_PASSWORD" "$pw"
          done

      - name: Migrate and seed
        run: |
          pnpm --filter @befine/db exec node --import tsx/esm src/migrate.ts
          pnpm --filter @befine/db exec node --import tsx/esm src/seed.ts
          pnpm --filter @befine/db exec node --import tsx/esm src/seed-e2e.ts

      - name: Install Playwright browsers
        run: pnpm --filter @befine/web exec playwright install --with-deps chromium

      - name: Clean Next.js build cache
        run: rm -rf apps/web/.next

      # SKIP_ENV_VALIDATION: compile-time schema skip. Only the Sentry upload uses repo secrets.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Start Next.js server for E2E
        run: pnpm --filter @befine/web exec next start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        # settlement closes the business day, so it runs after chromium (playwright.config.ts)
        run: pnpm --filter @befine/web test:e2e --project=chromium --project=settlement
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Post-deployment smoke tests: see post-deploy-smoke.yml (runs on Vercel's deployment_status).
